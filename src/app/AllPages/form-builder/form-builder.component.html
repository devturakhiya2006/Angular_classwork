<p>form-builder works!</p>
<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">Sign Up</h4>
        </div>
        <div class="card-body">
          <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()" novalidate>
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input id="name" type="text" class="form-control" formControlName="name"
              [class.is-invalid]="signUpForm.get('name')?.invalid &&
                signUpForm.get('name')?.touched" />
              <div class="invalid-feedback" *ngIf="signUpForm.get('name')?.invalid &&
              signUpForm.get('name')?.touched">
                Name is required.
              </div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input id="email" type="email" class="form-control"
              formControlName="email" [class.is-invalid]="signUpForm.get('email')?.invalid &&
                 signUpForm.get('email')?.touched" />
              <div class="invalid-feedback" *ngIf="signUpForm.get('email')?.invalid &&
                signUpForm.get('email')?.touched">
                Enter a valid email.
              </div>
            </div>


            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input id="password" type="password" class="form-control" formControlName="password"
                [class.is-invalid]="signUpForm.get('password')?.invalid && signUpForm.get('password')?.touched" />
              <div class="invalid-feedback" *ngIf="signUpForm.get('password')?.invalid &&
                 signUpForm.get('password')?.touched">
                Password must be at least 6 characters.
              </div>
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary" [disabled]="signUpForm.invalid">
                Sign Up
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
