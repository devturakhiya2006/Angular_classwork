<div>
    <img [src]="imgurl" [alt]="courseTitle + ' Image'" />
</div>
<div>
    <input type="text" [(ngModel)]="courseTitle" placeholder="Enter course title" />
    <h1> welcome to :
        {{ courseTitle }}</h1>
</div>
<div style=" background-color: #f0f0f0; border: 1px solid black; padding: 10px; width: 300px;">
    <p>
        Course:{{ courseTitle }} <br>
        duration:{{ courseDuration }} <br>
        fees:{{ courseFee }} <br>
        available:{{ isCourseAvailable }} <br>

    </p>
    <div>
        <input type="button" class="btn btn-success" (click)="enrollnow()" value="Enroll Now" />
    </div>
</div>
